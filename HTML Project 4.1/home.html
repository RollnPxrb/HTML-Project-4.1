<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll an Go Rentals</title>


    <link rel="stylesheet" href="Roll an Go.css">
    <script src="javascript.js"></script>
</head>


<body>
    <header>
        <div class="logo-container">
            <a href="index.html">


                <img src="logo.png" alt="Company Logo">
            </a>
        </div>


        <nav>
            <ul>
                <li><a href="Roll an Go.html" class="active">Home</a></li>
                <li><a href="cars.html">Our Cars</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="location.html">Location</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>


    <main>
        <section class="cars-banner">
            <img src="cars-banner.jpg" alt="Parking Banner">
        </section>




    </main>

   
    <div id="geoblock" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background-color: #01071f; border: 2px solid #d3a44b; padding: 40px; border-radius: 12px; max-width: 500px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <h2 style="color: #d3a44b; font-size: 28px; margin-top: 0;">Out of service error</h2>
        <p style="color: #ffffff; font-size: 18px; line-height: 1.5; margin: 20px 0;">
            <span id="geotext">Access to this website is restricted in your current location.</span>
        </p>

    </div>
    </div>

<script>

 const allowedIP = ["103.141.203.2", "136.158.83.32"]; // company wifi : KMC Solutions IP address & Home wifi
    const text = document.getElementById('geotext')

    text.innerText = "Access to this website is restricted in your current location."

document.addEventListener('DOMContentLoaded', () => {
    const geoblock = document.getElementById('geoblock');
    // Fetch the user's current public IP address
    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
            const userIP = data.ip;

            const currentIP = allowedIP.some(item => item.includes(userIP));
            if (currentIP) {
                // They are on the correct Wi-Fi, reveal the website
                geoblock.style.display = 'none';
                text.innerText = "Access to this website is restricted in your current location."
            } else {
                // They are on the wrong Wi-Fi, show the error
                geoblock.style.display = 'flex';
                text.innerText = "Access to this website is restricted in your current location."
            }
        })
        .catch(error => {
            geoblock.style.display = 'flex';
            text.innerText = "You are currently offline. Please check your network settings.";

        });
});

</script>
</body>
</html>
